[project]
name = "zelos-extension-photon"
version = "0.1.0"
description = "Zelos extension: load and upload Longhorn Racing Solar Photon telemetry sessions."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "zelos-sdk==0.0.13",
    "requests>=2.31",
    "websockets>=13.0",
    # Windows has no IANA time zone database; zoneinfo needs this to show local session times.
    "tzdata>=2024.1",
]

[project.urls]
Homepage = "https://github.com/lhr-solar/zelos-extensions"
Repository = "https://github.com/lhr-solar/zelos-extensions"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zelos_extension_photon"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4"]
